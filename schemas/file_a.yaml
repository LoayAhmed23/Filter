# =============================================================================
# Schema: File A — Regulatory Report A
# =============================================================================
# Customize this file to match your actual report structure.
# Each field maps to an Excel column header in the specified sheet.

name: file_a
description: "Regulatory Report A — sample schema (customize to your needs)"
sheet_name: Sheet1
header_row: 1      # 1-indexed row number where column headers are
data_start_row: 2  # 1-indexed row number where data begins

fields:
  # ── Required fields ────────────────────────────────────────────────────
  - name: transaction_id
    column: "Transaction ID"
    data_type: string
    category: required
    max_length: 20
    min_length: 1
    description: "Unique transaction identifier"

  - name: report_date
    column: "Report Date"
    data_type: date
    category: required
    date_format: "%Y-%m-%d"
    description: "Date of the report"

  - name: transaction_type
    column: "Transaction Type"
    data_type: string
    category: required
    catalog: transaction_types    # must match a value in catalogs/transaction_types.csv
    description: "Type of transaction"

  - name: amount
    column: "Amount"
    data_type: float
    category: required
    min_value: 0
    description: "Transaction amount"

  - name: currency_code
    column: "Currency"
    data_type: string
    category: required
    catalog: currency_codes
    max_length: 3
    min_length: 3
    description: "ISO 4217 currency code"

  - name: country_code
    column: "Country"
    data_type: string
    category: required
    catalog: country_codes
    max_length: 2
    min_length: 2
    description: "ISO 3166-1 alpha-2 country code"

  # ── Optional fields ────────────────────────────────────────────────────
  - name: remarks
    column: "Remarks"
    data_type: string
    category: optional
    max_length: 500
    description: "Free-text remarks"

  - name: reference_number
    column: "Reference No."
    data_type: string
    category: optional
    pattern: "^REF-[0-9]{6,10}$"
    description: "Optional reference in format REF-NNNNNN"

  # ── Group fields (conditional mandatory) ───────────────────────────────
  # If ANY field in a group is filled, ALL fields in that group are required.
  - name: agent_code
    column: "Agent Code"
    data_type: string
    category: "group:agent_info"
    catalog: agent_codes
    description: "Agent identifier (part of agent_info group)"

  - name: agent_name
    column: "Agent Name"
    data_type: string
    category: "group:agent_info"
    max_length: 100
    description: "Agent full name (part of agent_info group)"

  - name: agent_branch
    column: "Agent Branch"
    data_type: string
    category: "group:agent_info"
    catalog: branch_codes
    description: "Agent branch code (part of agent_info group)"

  # Add more fields as needed...
  # You can define up to ~70 fields following the same pattern.
